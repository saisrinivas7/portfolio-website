<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saisrinivas Mamunuru</title>
<meta name="description" content="Software engineer working on AI systems and the data infrastructure behind them.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--ink:#e9eaf0;--soft:#9598a9;--faint:#5d6073;--accent:#b0a5dc}
html,body{height:100%}
body{margin:0;color:var(--ink);
  font:400 15px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(760px 520px at 68% 28%, rgba(88,78,140,.13) 0%, rgba(88,78,140,0) 68%),
    radial-gradient(1100px 720px at 42% 55%, #16161f 0%, #0c0c12 56%, #08080c 100%);
  display:grid;place-items:center;overflow:hidden}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.stage{position:relative;z-index:1;width:min(740px,93vw);height:min(500px,76vh);
  display:grid;place-items:center}

/* the sun: an ambient warm wash, plus a small disc above the name.
   Sits behind everything and never moves -- the planets drift, it doesn't. */
.sun{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,78vw);height:min(560px,78vw);border-radius:50%;
  pointer-events:none;z-index:0;
  background:radial-gradient(circle,
    rgba(246,198,124,.115) 0%,
    rgba(240,180,100,.062) 27%,
    rgba(228,158,88,.022) 50%,
    rgba(228,158,88,0) 72%);
  animation:breathe 14s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.88}50%{opacity:1}}

.disc{width:30px;height:30px;border-radius:50%;margin:0 auto .95rem;
  background:radial-gradient(circle at 38% 33%, #ffdca6 0%, #f4b862 44%, #dd9840 100%);
  box-shadow:0 0 20px rgba(242,184,104,.42), 0 0 56px rgba(242,184,104,.16)}

.core{text-align:center;max-width:25rem;z-index:2;position:relative}
h1{font-size:1.48rem;font-weight:600;letter-spacing:-.02em;margin:0 0 .32rem}
.role{color:var(--soft);font-size:.94rem;margin:0 0 .8rem}
.bio{color:var(--soft);font-size:.91rem;margin:0}

.drift{position:absolute;text-decoration:none;color:var(--ink);font-size:1rem;
  display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;
  transition:color .25s ease,text-shadow .25s ease}
.drift span{border-bottom:1px solid transparent;padding-bottom:1px;
  transition:border-color .25s ease}
.drift:hover{color:#fff;text-shadow:0 0 15px rgba(176,165,220,.4)}
.drift:hover span{border-bottom-color:var(--accent)}
.drift svg{flex:0 0 auto;opacity:.82;transition:opacity .25s ease,transform .5s ease}
.drift:hover svg{opacity:1;transform:rotate(12deg) scale(1.08)}

.d1{top:8%;left:11%}
.d2{top:24%;right:6%}
.d3{bottom:25%;left:2%}
.d4{bottom:10%;right:15%}
.d5{top:51%;right:0}
.soc{position:absolute;bottom:-2.6rem;left:50%;transform:translateX(-50%);
  display:flex;gap:1.15rem;font-size:.8rem;white-space:nowrap}
.soc a{color:var(--faint);text-decoration:none}
.soc a:hover{color:var(--accent)}
@media(max-width:660px){
  body{overflow:auto;display:block}
  .stage{height:auto;display:flex;flex-direction:column;gap:1.4rem;padding:4rem 1.5rem 3rem;width:100%}
  .core{order:-1;margin-bottom:1rem}
  .drift{position:static!important;transform:none!important;font-size:1.05rem}
  .soc{position:static;transform:none;margin-top:1.5rem}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="p-ring" viewBox="0 0 26 26">
      <ellipse cx="13" cy="13" rx="12" ry="3.6" fill="none" stroke="#c9a07e" stroke-opacity=".5" stroke-width="1.3" transform="rotate(-18 13 13)"/>
      <circle cx="13" cy="13" r="6.6" fill="#c9a07e"/>
      <circle cx="10.6" cy="10.7" r="2.3" fill="#fff" opacity=".16"/>
    </symbol>
    <symbol id="p-band" viewBox="0 0 26 26">
      <clipPath id="c-band"><circle cx="13" cy="13" r="7"/></clipPath>
      <circle cx="13" cy="13" r="7" fill="#8ea7bd"/>
      <g clip-path="url(#c-band)">
        <rect x="4" y="10.4" width="18" height="1.7" fill="#6f8ba3" opacity=".85"/>
        <rect x="4" y="14.6" width="18" height="1.2" fill="#6f8ba3" opacity=".7"/>
      </g>
      <circle cx="10.6" cy="10.6" r="2.2" fill="#fff" opacity=".15"/>
    </symbol>
    <symbol id="p-moon" viewBox="0 0 26 26">
      <circle cx="13" cy="13" r="6.8" fill="#b2ada4"/>
      <circle cx="10.4" cy="11.2" r="1.5" fill="#948f86" opacity=".8"/>
      <circle cx="15.4" cy="15" r="1.1" fill="#948f86" opacity=".7"/>
      <circle cx="15.2" cy="10.3" r=".8" fill="#948f86" opacity=".6"/>
    </symbol>
    <symbol id="p-satellite" viewBox="0 0 26 26">
      <circle cx="11.5" cy="14" r="6.2" fill="#7fa892"/>
      <circle cx="9.4" cy="12" r="2" fill="#fff" opacity=".15"/>
      <circle cx="20.5" cy="6.5" r="2.1" fill="#cfd6cf" opacity=".85"/>
    </symbol>
    <symbol id="p-ring2" viewBox="0 0 26 26">
      <ellipse cx="13" cy="13" rx="11.4" ry="3.2" fill="none" stroke="#a596c6" stroke-opacity=".45" stroke-width="1.2" transform="rotate(22 13 13)"/>
      <circle cx="13" cy="13" r="6.2" fill="#a596c6"/>
      <circle cx="10.9" cy="10.9" r="2" fill="#fff" opacity=".16"/>

  </defs>
</svg>

<div class="stage">
  <div class="sun"></div>

  <a class="drift d1" data-depth="1.7" href="experience.html"><svg width="21" height="21"><use href="#p-ring"/></svg><span>work</span></a>
  <a class="drift d2" data-depth="1.1" href="projects.html"><svg width="21" height="21"><use href="#p-band"/></svg><span>projects</span></a>
  <a class="drift d3" data-depth="2.1" href="blog.html"><svg width="21" height="21"><use href="#p-moon"/></svg><span>writing</span></a>
  <a class="drift d4" data-depth="1.4" href="photography.html"><svg width="21" height="21"><use href="#p-satellite"/></svg><span>photos</span></a>
  <a class="drift d5" data-depth="0.8" href="education.html"><svg width="21" height="21"><use href="#p-ring2"/></svg><span>education</span></a>

  <div class="core">
    <div class="disc"></div>
    <h1>Saisrinivas Mamunuru</h1>
    <p class="role">software engineer</p>
    <p class="bio">I like teaching machines to answer</p>
  </div>

  <div class="soc"><a href="https://github.com/saisrinivas7" target="_blank" rel="noopener">github</a><a href="https://linkedin.com/in/saisrinivas7" target="_blank" rel="noopener">linkedin</a><a href="mailto:ssmamunuru@gmail.com">email</a></div>
</div>

<script>
(function(){
  const c=document.getElementById('sky'),x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const links=[...document.querySelectorAll('.drift')];
  let w,h,dpr,layers=[],mx=0,my=0,cx=0,cy=0;

  function mk(n,rmin,rmax,amax){
    return Array.from({length:n},()=>({
      x:Math.random()*w,y:Math.random()*h,
      r:rmin+Math.random()*(rmax-rmin),
      a:amax*(0.55+Math.random()*0.45)
    }));
  }
  function build(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    w=innerWidth;h=innerHeight;
    c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
    x.setTransform(dpr,0,0,dpr,0,0);
    layers=[
      mk(Math.round(w*h/16000),0.25,0.55,0.14),
      mk(Math.round(w*h/34000),0.45,0.85,0.26),
      mk(Math.round(w*h/72000),0.7,1.2,0.42)
    ];
  }
  function paint(ox0,oy0){
    x.clearRect(0,0,w,h);
    layers.forEach((layer,i)=>{
      const k=(i+1)*5,ox=ox0*k,oy=oy0*k;
      for(const s of layer){
        x.beginPath();x.fillStyle='rgba(230,234,250,'+s.a+')';
        x.arc(s.x+ox,s.y+oy,s.r,0,6.283);x.fill();
      }
    });
  }
  function draw(){
    cx+=(mx-cx)*0.045;cy+=(my-cy)*0.045;
    paint(-cx,-cy);
    links.forEach(a=>{
      const d=parseFloat(a.dataset.depth)||1;
      a.style.transform='translate3d('+(-cx*d*14)+'px,'+(-cy*d*14)+'px,0)';
    });
    requestAnimationFrame(draw);
  }

  build();
  addEventListener('resize',()=>{build();if(reduce)paint(0,0)});
  if(!reduce){
    addEventListener('mousemove',e=>{mx=(e.clientX/w-0.5)*2;my=(e.clientY/h-0.5)*2});
    requestAnimationFrame(draw);
  }else paint(0,0);
})();
</script>
</body>
</html>
